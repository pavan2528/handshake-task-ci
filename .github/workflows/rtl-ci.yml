name: Candidate Task Docker + Harbor Validation

on:
  push:
    branches: [main]
    paths:
      - 'tasks/**'
      - 'ci/request.txt'
      - 'scripts/**'
      - '.github/workflows/rtl-ci.yml'
  workflow_dispatch:
    inputs:
      task_path:
        description: 'Task directory staged within THIS repository'
        required: true
        default: 'tasks/pcie-reassembly'
        type: string
  repository_dispatch:
    types: [validate-staged-task]

permissions:
  contents: read
  statuses: write

concurrency:
  group: stage-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Staged candidate (Docker, Harbor, Oracle x2, Nop x2)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout staged candidate and verifier scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm staging repository is PRIVATE
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [[ "${REPO_PRIVATE}" != 'true' ]]; then
            echo "::error::This staging repo is PUBLIC. Make it private before pushing any private task, solution, or verifier. CI will not execute in a public repo."
            exit 1
          fi
          echo "Verified private staging repository."

      - name: Resolve staged task path
        id: task
        shell: bash
        env:
          REQUESTED_PATH: ${{ inputs.task_path || github.event.client_payload.task_path || '' }}
        run: |
          path="${REQUESTED_PATH}"
          if [[ -z "${path}" ]]; then
            path="$(sed -n 's/^task_path=//p' ci/request.txt | head -n 1)"
          fi
          if [[ -z "${path}" ]]; then path='tasks/pcie-reassembly'; fi
          if [[ ! "${path}" =~ ^tasks/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid task_path; use tasks/<task-name>."
            exit 1
          fi
          if [[ ! -f "${path}/task.toml" ]]; then
            echo "::error::No staged task at ${path}. Stage a complete candidate in THIS private repo first."
            exit 1
          fi
          printf 'path=%s\n' "${path}" >> "${GITHUB_OUTPUT}"

      - name: Lint scripts and record candidate tree
        env:
          TASK_PATH: ${{ steps.task.outputs.path }}
        shell: bash
        run: |
          bash -n scripts/verify_pcie.sh scripts/verify_harbor.sh
          python3 - "${TASK_PATH}" <<'PY'
          import pathlib, sys, tomllib
          task = pathlib.Path(sys.argv[1])
          config = tomllib.loads((task/'task.toml').read_text())
          assert (task/'instruction.md').is_file()
          assert (task/'solution'/'solve.sh').is_file()
          assert (task/'tests'/'test.sh').is_file()
          assert config['task']['name']
          print('Task schema and required files: OK')
          PY
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse "HEAD:${TASK_PATH}")"
          {
            echo '### Staged candidate'
            echo ''
            printf '%s\n' "Task: ${TASK_PATH}"
            printf '%s\n' "Staging commit: ${sha}"
            printf '%s\n' "Exact task tree SHA: ${tree}"
            echo ''
            echo 'Promote the same task tree into the target fork only after all checks pass.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Docker native image/verifier preflight for PCIe
        if: steps.task.outputs.path == 'tasks/pcie-reassembly'
        timeout-minutes: 30
        shell: bash
        run: bash scripts/verify_pcie.sh "${GITHUB_WORKSPACE}"

      - name: Install Harbor benchmark CLI
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install and identify Harbor version
        shell: bash
        run: |
          uv tool install harbor
          harbor --version
          docker version

      - name: Independent Harbor Oracle x2 and Nop x2
        timeout-minutes: 65
        shell: bash
        env:
          TASK_PATH: ${{ steps.task.outputs.path }}
        run: bash scripts/verify_harbor.sh "${TASK_PATH}"

      - name: Publish queryable staging status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "${JOB_RESULT}" == 'success' ]]; then state=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='task-staging/docker-harbor' \
            -f description="Staged Docker/Harbor Oracle+Nop: ${state}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
